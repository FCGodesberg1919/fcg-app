<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenschutzerklärung – 1. FC Godesberg</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8b0000 0%, #fff 100%);
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: #8b0000;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .pdf-section {
            padding: 20px;
            background: #f9f9f9;
            border-bottom: 3px solid #8b0000;
        }
        .pdf-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #856404;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-section {
            padding: 30px;
        }
        .form-section h3 {
            color: #8b0000;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #8b0000;
            background: #fff8f8;
        }
        .checkbox-group {
            margin: 20px 0;
            padding: 15px;
            background: #fff8f8;
            border-radius: 5px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin: 0;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #8b0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover:not(:disabled) {
            background: #a00000;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .success {
            display: none;
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .timestamp {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ 1. FC Godesberg 1919/22</h1>
        </div>

        <div class="pdf-section">
            <div class="pdf-info">
                ℹ️ Bitte lies die Datenschutzerklärung und bestätige dann mit deinen Daten.
            </div>
            
            <iframe src="https://FCGodesberg1919.github.io/fcg-app/Datenschutzerklaerung_Formular2026.pdf#toolbar=1" 
                    title="Datenschutzerklärung"></iframe>
        </div>

        <div class="form-section">
            <h3>✓ Datenschutzerklärung akzeptieren</h3>

            <form id="form">
                <div class="form-group">
                    <label for="vorname">Vorname *</label>
                    <input type="text" id="vorname" name="vorname" required>
                </div>

                <div class="form-group">
                    <label for="nachname">Nachname *</label>
                    <input type="text" id="nachname" name="nachname" required>
                </div>

                <div class="form-group">
                    <label for="geburtsdatum">Geburtsdatum *</label>
                    <input type="date" id="geburtsdatum" name="geburtsdatum" required>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="accept" required>
                        <span><strong>Ich akzeptiere die oben genannte Datenschutzerklärung</strong></span>
                    </label>
                </div>

                <button type="submit">✓ Akzeptieren</button>

                <div class="success" id="success">
                    ✓ Erfolgreich akzeptiert!<br>
                    <div class="timestamp" id="zeit"></div>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const vorname = document.getElementById('vorname').value;
            const nachname = document.getElementById('nachname').value;
            const geburtsdatum = document.getElementById('geburtsdatum').value;
            const jetzt = new Date();
            const zeitstempel = jetzt.toLocaleString('de-DE');

            const formData = new FormData();
            formData.append('Vorname', vorname);
            formData.append('Nachname', nachname);
            formData.append('Geburtsdatum', geburtsdatum);
            formData.append('Akzeptiert', 'Ja');
            formData.append('Zeitstempel', zeitstempel);
            formData.append('_subject', `Datenschutzerklärung akzeptiert: ${vorname} ${nachname}`);

            try {
                await fetch('https://formspree.io/f/xlgyrwop', {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.log('Email konnte nicht versendet werden');
            }

            document.getElementById('form').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            document.getElementById('zeit').innerHTML = `Akzeptiert: ${zeitstempel}`;
        });
    </script>
</body>
</html>
