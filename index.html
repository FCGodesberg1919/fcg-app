import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyBL6sD5N38sRygqaJdQBNq-6NAE51CyCDw",
authDomain: "fcgapp-2026-intern.firebaseapp.com",
projectId: "fcgapp-2026-intern",
storageBucket: "fcgapp-2026-intern.firebasestorage.app",
messagingSenderId: "200140077097",
appId: "1:200140077097:web:570c5e6b10f36dd7850438"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
// Firebase-Funktionen global verfügbar machen für die React-App
window.fb = {
// Wert speichern (key -> beliebiges JSON)
set: async (key, value) => {
await setDoc(doc(db, "shared", key), { value: JSON.stringify(value) });
},
// Wert löschen
del: async (key) => {
await deleteDoc(doc(db, "shared", key));
},
// Echtzeit-Listener: ruft cb(value) bei jeder Änderung auf
listen: (key, cb) => {
return onSnapshot(doc(db, "shared", key), (snap) => {
if (snap.exists() && snap.data().value) {
try { cb(JSON.parse(snap.data().value)); } catch(e) { cb(null); }
} else {
cb(null);
}
}, (err) => { console.warn("Firestore listen error:", key, err); });
}
};
window.dispatchEvent(new Event("fb-ready"));
</script>

}

// Berechnet die nächsten Termine (3 Monate) für einen Wochentag
function naechsteTermine(weekday, monate) {
const out = [];
if (weekday === undefined || weekday === null || weekday === '') return out;
const wd = Number(weekday);
const today = new Date(); today.setHours(0,0,0,0);
const ende = new Date(today); ende.setMonth(ende.getMonth() + (monate || 3));
const d = new Date(today);
while (d.getDay() !== wd) d.setDate(d.getDate() + 1);
while (d <= ende) {
out.push(new Date(d));
d.setDate(d.getDate() + 7);
}
return out;
}
function formatDatum(d) {
return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });

function uploadPlatz(file) {
if (!file) return;
const reader = new FileReader();
reader.onload = (e) => {
const img = new Image();
img.onload = () => {
const canvas = document.createElement('canvas');
let w = img.width, h = img.height; const maxDim = 1400;
if (w > maxDim || h > maxDim) { if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / h); h = maxDim; } }
canvas.width = w; canvas.height = h;
canvas.getContext('2d').drawImage(img, 0, 0, w, h);
window.fb.set('platzImg', canvas.toDataURL('image/jpeg', 0.8));
};
img.src = e.target.result;
};
reader.readAsDataURL(file);
}

// === PUSH: Button zum Aktivieren der Benachrichtigungen ===
function PushAktivieren() {
const [status, setStatus] = useState('start'); // start | aktiv | abgelehnt
useEffect(() => {
if (window.OneSignal && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
setStatus('aktiv');
}
}, []);
async function aktivieren() {
try {
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.OneSignalDeferred.push(async function(OneSignal) {
await OneSignal.Notifications.requestPermission();
if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
setStatus('aktiv');
} else {
setStatus('abgelehnt');
}
});
} catch (e) {
console.warn('Push-Aktivierung fehlgeschlagen:', e);
setStatus('abgelehnt');
}
}
if (status === 'aktiv') {
return (
<div className="bg-green-900/30 border border-green-600 rounded-xl p-4 flex items-center gap-3">
<span className="text-2xl">✅</span>
<div>
<p className="text-green-200 font-semibold">Benachrichtigungen sind aktiv</p>
<p className="text-green-300/70 text-xs">Du bekommst Trainingsabsagen direkt aufs Handy.</p>
</div>
</div>
);
}
return (
<div className="bg-gradient-to-r from-red-700 to-red-600 rounded-xl p-4">
<div className="flex items-center gap-3 mb-3">
<span className="text-2xl">🔔</span>
<div>
<p className="text-white font-bold">Benachrichtigungen aktivieren</p>
<p className="text-red-100 text-xs">Verpasse keine Trainingsabsage mehr!</p>
</div>
</div>
<button onClick={aktivieren} className="w-full bg-white text-red-700 font-bold py-2.5 rounded-lg hover:bg-red-50">
🔔 Jetzt aktivieren
</button>
{status === 'abgelehnt' && (
<p className="text-red-100 text-xs mt-2">
Benachrichtigungen sind blockiert. Bitte erlaube sie in den Browser-Einstellungen (Schloss-Symbol 🔒 neben der Adresse) und lade die Seite neu.
</p>
)}
</div>
);
}

function FormsPage({ forms, isAdmin, addForm, delForm }) {
async function teilen(f) {
// Daten-URL in eine Datei umwandeln und teilen (falls unterstützt)
try {
const res = await fetch(f.data);
const blob = await res.blob();
const file = new File([blob], f.name || 'formular', { type: blob.type });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file], title: f.title, text: f.title });
return;
}
} catch (e) { console.warn('Datei-Teilen nicht möglich:', e); }
// Fallback: nur Text/Titel teilen
try {
if (navigator.share) { await navigator.share({ title: f.title, text: f.title }); return; }
} catch (e) {}
// Letzter Fallback: Download öffnen
const a = document.createElement('a');
a.href = f.data; a.download = f.name || 'formular'; a.click();
}
return (
<div className="space-y-4">
<h2 className="text-2xl font-bold text-white">📄 Formulare</h2>
<p className="text-slate-400 text-sm">Formulare ansehen, herunterladen oder direkt an die Eltern weiterleiten – papierlos! 🌱</p>

function AddFormUpload({ onAdd }) {
const [open, setOpen] = useState(false);
const [title, setTitle] = useState('');
const [data, setData] = useState(null);
const [name, setName] = useState('');
const [type, setType] = useState('');
const [fehler, setFehler] = useState('');
function ladeDatei(file) {
if (!file) return;
setFehler('');
const istBild = file.type.startsWith('image/');
const istPdf = file.type === 'application/pdf';
if (!istBild && !istPdf) { setFehler('Bitte ein PDF oder Bild (JPG/PNG) auswählen.'); return; }
setName(file.name);
setType(file.type);
if (istBild) {
// Bild verkleinern
const reader = new FileReader();
reader.onload = (e) => {
const image = new Image();
image.onload = () => {
const canvas = document.createElement('canvas');
let w = image.width, h = image.height; const maxDim = 1400;
if (w > maxDim || h > maxDim) { if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / h); h = maxDim; } }
canvas.width = w; canvas.height = h;
canvas.getContext('2d').drawImage(image, 0, 0, w, h);
setData(canvas.toDataURL('image/jpeg', 0.8));
if (!title) setTitle(file.name.replace(/\.[^.]+$/, ''));
};
image.src = e.target.result;
};
reader.readAsDataURL(file);
} else {
// PDF: Größe prüfen (Firestore-Limit ~1MB, Daten-URL ist ~33% größer)
if (file.size > 720 * 1024) {
setFehler('Dieses PDF ist zu groß (' + Math.round(file.size/1024) + ' KB). Bitte ein kleineres PDF (unter ~700 KB) verwenden oder als Bild hochladen.');
return;
}
const reader = new FileReader();
reader.onload = (e) => { setData(e.target.result); if (!title) setTitle(file.name.replace(/\.[^.]+$/, '')); };
reader.readAsDataURL(file);
}
}
const submit = () => {
if (!data) { setFehler('Bitte zuerst eine Datei auswählen.'); return; }
if (!title.trim()) { setFehler('Bitte einen Titel eingeben.'); return; }
onAdd({ title: title.trim(), data, name, type, date: new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) });
setTitle(''); setData(null); setName(''); setType(''); setFehler(''); setOpen(false);
};
if (!open) return <button onClick={() => setOpen(true)} className="bg-green-700 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-semibold">+ Formular hochladen</button>;
return (
<div className="bg-slate-800 p-4 rounded-xl border border-green-700 space-y-3">
<p className="text-green-300 text-sm font-semibold">📄 Neues Formular</p>
<input placeholder="Titel (z.B. Einverständniserklärung)" value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-slate-700 text-white rounded px-3 py-2 text-sm" />
{data ? (
<div className="bg-slate-900 rounded-lg p-3 flex items-center justify-between">
<span className="text-white text-sm truncate">✓ {name}</span>
<button onClick={() => { setData(null); setName(''); }} className="text-red-400 ml-2">✕</button>
</div>
) : (
<label className="block bg-slate-600 hover:bg-slate-500 text-white px-4 py-3 rounded-lg font-semibold cursor-pointer text-sm text-center">
📎 PDF oder Bild auswählen
<input type="file" accept="application/pdf,image/*" className="hidden" onChange={e => ladeDatei(e.target.files[0])} />
</label>
)}
{fehler && <p className="text-red-400 text-xs">{fehler}</p>}
<p className="text-slate-500 text-xs">Bilder werden automatisch verkleinert. PDFs bitte unter ~700 KB.</p>
<div className="flex gap-2">
<button onClick={submit} className="flex-1 bg-green-700 hover:bg-green-600 text-white py-2 rounded">✓ Speichern</button>
<button onClick={() => { setOpen(false); setData(null); setName(''); setTitle(''); setFehler(''); }} className="bg-slate-600 text-white py-2 px-4 rounded">Abbrechen</button>
</div>
</div>
);
}

// Ankündigungs-Formular mit optionalem Bild-Upload
function AddAnnForm({ onAdd }) {
const [open, setOpen] = useState(false);
const [title, setTitle] = useState('');
const [desc, setDesc] = useState('');
const [img, setImg] = useState(null);
const [busy, setBusy] = useState(false);
function ladeBild(file) {
if (!file) return;
const reader = new FileReader();
reader.onload = (e) => {
const image = new Image();
image.onload = () => {
const canvas = document.createElement('canvas');
let w = image.width, h = image.height; const maxDim = 1200;
if (w > maxDim || h > maxDim) { if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / h); h = maxDim; } }
canvas.width = w; canvas.height = h;
canvas.getContext('2d').drawImage(image, 0, 0, w, h);
setImg(canvas.toDataURL('image/jpeg', 0.8));
};
image.src = e.target.result;
};
reader.readAsDataURL(file);
}
const submit = () => {
if (!title.trim() && !desc.trim() && !img) return;
setBusy(true);
onAdd({ title: title.trim(), desc: desc.trim(), img: img || null, date: new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) });
setTitle(''); setDesc(''); setImg(null); setBusy(false); setOpen(false);
};
if (!open) return <button onClick={() => setOpen(true)} className="mt-3 bg-green-700 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-semibold">+ Ankündigung hinzufügen</button>;
return (
<div className="mt-3 bg-slate-800 p-4 rounded-xl border border-green-700 space-y-3">
<p className="text-green-300 text-sm font-semibold">📣 Neue Ankündigung</p>
<input placeholder="Titel" value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-slate-700 text-white rounded px-3 py-2" />
<textarea placeholder="Text (optional)" value={desc} onChange={e => setDesc(e.target.value)} rows={3} className="w-full bg-slate-700 text-white rounded px-3 py-2" />
{img ? (
<div className="relative">
<img src={img} className="w-full h-auto block rounded-lg" />
<button onClick={() => setImg(null)} className="absolute top-2 right-2 bg-red-700 text-white rounded-full w-8 h-8">✕</button>
</div>
) : (
<label className="inline-block bg-slate-600 hover:bg-slate-500 text-white px-4 py-2 rounded-lg font-semibold cursor-pointer text-sm">
📷 Bild hinzufügen (optional)
<input type="file" accept="image/*" className="hidden" onChange={e => ladeBild(e.target.files[0])} />
</label>
)}
<p className="text-slate-500 text-xs">🔔 Alle Mitglieder bekommen eine Benachrichtigung. Bild wird automatisch verkleinert.</p>
<div className="flex gap-2">
<button onClick={submit} disabled={busy} className="flex-1 bg-green-700 hover:bg-green-600 text-white py-2 rounded disabled:opacity-50">✓ Veröffentlichen</button>
<button onClick={() => { setOpen(false); setTitle(''); setDesc(''); setImg(null); }} className="bg-slate-600 text-white py-2 px-4 rounded">Abbrechen</button>
</div>
</div>
);
}
// Generisches Formular
function AddForm({ fields, label, onAdd, req }) {
const [open, setOpen] = useState(false);
const [vals, setVals] = useState({});
const submit = () => {
for (const r of (req || [])) if (!vals[r] || !vals[r].trim()) return;
onAdd(vals); setVals({}); setOpen(false);
};
if (!open) return <button onClick={() => setOpen(true)} className="mt-3 bg-green-700 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-semibold">+ {label}</button>;
return (
<div className="mt-3 bg-slate-800 p-4 rounded-xl border border-green-700 space-y-2">
{fields.map(([k, ph]) => <input key={k} placeholder={ph} value={vals[k] || ''} onChange={e => setVals({ ...vals, [k]: e.target.value })} className="w-full bg-slate-700 text-white rounded px-3 py-2" />)}
<div className="flex gap-2"><button onClick={submit} className="flex-1 bg-green-700 text-white py-2 rounded">✓ Speichern</button><button onClick={() => setOpen(false)} className="bg-slate-600 text-white py-2 px-4 rounded">Abbrechen</button></div>
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
