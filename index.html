<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL6sD5N38sRygqaJdQBNq-6NAE51CyCDw",
  authDomain: "fcgapp-2026-intern.firebaseapp.com",
  projectId: "fcgapp-2026-intern",
  storageBucket: "fcgapp-2026-intern.firebasestorage.app",
  messagingSenderId: "200140077097",
  appId: "1:200140077097:web:570c5e6b10f36dd7850438"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Firebase-Funktionen global verfügbar machen für die React-App
window.fb = {
  // Wert speichern (key -> beliebiges JSON)
  set: async (key, value) => {
    await setDoc(doc(db, "shared", key), { value: JSON.stringify(value) });
  },
  // Wert löschen
  del: async (key) => {
    await deleteDoc(doc(db, "shared", key));
  },
  // Echtzeit-Listener: ruft cb(value) bei jeder Änderung auf
  listen: (key, cb) => {
    return onSnapshot(doc(db, "shared", key), (snap) => {
      if (snap.exists() && snap.data().value) {
        try { cb(JSON.parse(snap.data().value)); } catch(e) { cb(null); }
      } else {
        cb(null);
      }
    }, (err) => { console.warn("Firestore listen error:", key, err); });
  }
};
window.dispatchEvent(new Event("fb-ready"));
</script>
